<!DOCTYPE html>

<title>REGEN · Spot Mismos años</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--night:#0E0F0D;--bone:#F9F8F4;--stone:#BFB19C;--muted:rgba(249,248,244,.58);--display:'Bodoni Moda','Didot',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--bone);font-family:var(--sans)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{text-align:center;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0}
video{width:min(100%,1120px);aspect-ratio:16/9;background:#000;display:block}
.note{max-width:62ch;text-align:center;font-size:12.5px;line-height:1.6;color:var(--muted);margin:0;font-weight:300}
</style>
</head>
<body>
<header>
<p class="eyebrow">REGEN · Spot 46"</p>
<h1>Mismos años</h1>
</header>
<video controls playsinline preload="metadata" poster="poster.jpg"><source src="mismos-anios.mp4" type="video/mp4"></video>
<p class="note">Escenas ilustrativas. Dato: promedio mundial, 2019 (Garmany y Terzic, JAMA Netw Open, 2024). Regen no promete resultados de salud individuales.</p>
