name: pruebas
# Corre las pruebas de test/ (Playwright, navegador real) en cada PR y en cada
# cambio a main. Para que bloquee la fusión: en GitHub, proteger main y marcar el
# chequeo «pruebas» como obligatorio (Settings > Branches).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Pruebas en el navegador
        run: npm test
